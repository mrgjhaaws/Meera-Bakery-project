name: Deploy Meera Bakery to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::660233303646:role/GitHubActions-MeeraBakery-Deploy
          aws-region: ap-south-1

      - name: Deploy to EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=Meera-Bakery-Web" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Meera Bakery from GitHub" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/Meera-Bakery-project",
              "git fetch origin main",
              "git reset --hard origin/main",
              "/opt/Meera-Bakery-project/venv/bin/pip install -r app/requirements.txt",
              "sudo systemctl restart meera-bakery",
              "sleep 10",
              "curl -f http://127.0.0.1:8000/health"
            ]' \
            --query "Command.CommandId" \
            --output text \
            --region ap-south-1)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$(aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=Meera-Bakery-Web" "Name=instance-state-name,Values=running" \
                --query "Reservations[0].Instances[0].InstanceId" \
                --output text \
                --region ap-south-1)" \
              --query "Status" \
              --output text \
              --region ap-south-1)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$(aws ec2 describe-instances \
                  --filters "Name=tag:Name,Values=Meera-Bakery-Web" "Name=instance-state-name,Values=running" \
                  --query "Reservations[0].Instances[0].InstanceId" \
                  --output text \
                  --region ap-south-1)" \
                --region ap-south-1

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
