<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Order details — Meera Bakery Online." />
  <title>Order Details — Meera Bakery Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container site-header__bar">
      <a href="index.html" class="brand">
        <span class="brand__mark">M</span>
        Meera Bakery
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html" data-nav="index.html">Home</a>
        <a href="products.html" data-nav="products.html">Products</a>
        <a href="index.html#about" data-nav="">About</a>
        <a href="index.html#contact" data-nav="">Contact</a>
        <a href="orders.html" data-nav="orders.html">My Orders</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="identity-chip" id="identityChip">
          <span class="identity-chip__avatar">👤</span>
          <span id="identityLabel">Log in</span>
        </button>
        <a href="cart.html" class="cart-btn" aria-label="View cart">
          🧺
          <span class="cart-badge" id="cartCount" hidden>0</span>
        </a>
        <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="identity-modal" id="identityModal" hidden>
    <div class="identity-modal__panel">
      <div class="identity-modal__head">
        <h3>Log in</h3>
        <button type="button" id="identityClose" aria-label="Close">✕</button>
      </div>

      <div id="loginBanner" class="banner banner--error" hidden></div>

      <form id="requestOtpForm">
        <p class="form-hint">Enter your email — we'll send you a 6-digit code.</p>
        <div class="form-field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div id="signupNameFields" hidden>
          <div class="form-field">
            <label for="loginFirstName">First name</label>
            <input type="text" id="loginFirstName" autocomplete="given-name" />
          </div>
          <div class="form-field">
            <label for="loginLastName">Last name</label>
            <input type="text" id="loginLastName" autocomplete="family-name" />
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="sendCodeBtn">Send code</button>
      </form>

      <form id="verifyOtpForm" hidden>
        <p class="form-hint">Enter the 6-digit code sent to <strong id="otpEmailLabel"></strong>.</p>
        <div class="form-field">
          <label for="loginOtpCode">Verification code</label>
          <input type="text" id="loginOtpCode" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="000000" />
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="verifyCodeBtn">Verify &amp; log in</button>
        <button type="button" class="link-arrow" id="backToEmailBtn" style="margin-top:12px;display:inline-block;background:none;border:none;cursor:pointer;">← Use a different email</button>
      </form>
    </div>
  </div>

  <main>
    <section class="section" style="padding-top:32px;">
      <div class="container" style="max-width:800px;">
        <p class="breadcrumb"><a href="orders.html">← My orders</a></p>
        <div id="orderDetail">
          <div class="skeleton" style="height:200px;margin-bottom:16px;"></div>
          <div class="skeleton" style="height:120px;"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0;">
        <span>© 2026 Meera Bakery Online. A learning project — no real order will be fulfilled.</span>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/order-detail.js"></script>
</body>
</html>
